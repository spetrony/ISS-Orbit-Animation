<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISS — Low Earth Orbit</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9"
  }
}
</script>
<style>
  html, body { margin: 0; background: #04060b; color: #e9e6dd; overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  a { color: #c9a24b; } a:hover { color: #e3c47a; }
  three-d-stage:not(:defined) { visibility: hidden; }
  .hud { position: fixed; top: 20px; left: 22px; display: grid; gap: 14px; pointer-events: none; }
  .hud h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .hud p { margin: 4px 0 0; font-size: 11px; letter-spacing: .06em; color: #9a978e; }
  .ctl { display: flex; gap: 6px; pointer-events: auto; }
  .ctl button { font: inherit; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding: 7px 11px; border-radius: 6px; border: 1px solid rgba(233,230,221,.22);
    background: rgba(10,12,18,.6); color: #e9e6dd; cursor: pointer; }
  .ctl button:hover { border-color: rgba(233,230,221,.5); }
  .ctl button[aria-pressed="true"] { background: #e9e6dd; color: #0a0c12; border-color: #e9e6dd; }

  /* Hide external export/download buttons injected by the component */
  three-d-stage button, 
  button:has-text("Download"),
  [id*="Download"],
  [class*="export"] {
    display: none !important;
  }
</style>
</head>
<body>
<three-d-stage name="iss-earth-orbit" background="#04060b"></three-d-stage>
<div class="hud">
  <div>
    <h1>International Space Station</h1>
    <p>Low Earth orbit · 51.6° inclination · not to scale</p>
  </div>
  <div class="ctl">
    <button id="vEarth" aria-pressed="true">Earth</button>
    <button id="vIss" aria-pressed="false">Follow ISS</button>
    <button id="pause" aria-pressed="false">Pause</button>
  </div>
</div>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

// ---------- materials ----------
const M = {
  truss:    new THREE.MeshStandardMaterial({ name: 'truss_aluminum', color: 0xa3a5a8, roughness: 0.5, metalness: 0.35 }),
  module:   new THREE.MeshStandardMaterial({ name: 'module_mli_white', color: 0xe9e5da, roughness: 0.8, metalness: 0.05 }),
  solar:    new THREE.MeshStandardMaterial({ name: 'solar_cells_gold', color: 0xc98a45, roughness: 0.4, metalness: 0.35, side: THREE.DoubleSide }),
  solarRu:  new THREE.MeshStandardMaterial({ name: 'solar_cells_blue', color: 0x24406b, roughness: 0.3, metalness: 0.3, side: THREE.DoubleSide }),
  radiator: new THREE.MeshStandardMaterial({ name: 'radiator_white', color: 0xf6f5f0, roughness: 0.55, metalness: 0.0 }),
  dark:     new THREE.MeshStandardMaterial({ name: 'hardware_dark', color: 0x3b3d42, roughness: 0.6, metalness: 0.3 }),
};

const box = (name, mat, sx, sy, sz, x, y, z, parent) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
  m.name = name; m.position.set(x, y, z); parent.add(m); return m;
};
// cylinder along an axis ('x' | 'y' | 'z')
const cyl = (name, mat, r, len, axis, x, y, z, parent, r2 = r, seg = 40) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r2, r, len, seg), mat);
  m.name = name; m.position.set(x, y, z);
  if (axis === 'x') m.rotation.z = -Math.PI / 2;
  if (axis === 'z') m.rotation.x = Math.PI / 2;
  parent.add(m); return m;
};
const strut = (name, mat, r, a, b, parent) => {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 16), mat);
  m.name = name; m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  parent.add(m); return m;
};

// ---------- ISS (built in meters) ----------
const iss = new THREE.Group(); iss.name = 'ISS';

const truss = new THREE.Group(); truss.name = 'integrated_truss'; iss.add(truss);
box('truss_S0', M.truss, 13, 3.6, 3.6, 0, 0, 0, truss);
[['S', 1], ['P', -1]].forEach(([s, k]) => {
  box(`truss_${s}1`, M.truss, 14, 3.1, 3.4, k * 13.5, 0, 0, truss);
  box(`truss_${s}3`, M.truss, 12, 3.1, 3.1, k * 30.5, 0, 0, truss);
  box(`truss_${s}5`, M.truss, 13, 2.7, 2.7, k * 41, 0, 0, truss);
  box(`truss_${s}6`, M.truss, 7, 2.9, 2.9, k * 50.5, 0, 0, truss);
  cyl(`alpha_joint_${s}`, M.dark, 2.3, 1.6, 'x', k * 23.6, 0, 0, truss);
  box(`truss_${s}_end`, M.truss, 3, 2.6, 2.6, k * 22, 0, 0, truss);

  // Solar array wings: inner (4) and outer (6), each with a +z and -z wing
  [[`${s}4`, 34], [`${s}6`, 48.5]].forEach(([id, ax]) => {
    const x = k * ax;
    box(`beta_gimbal_${id}`, M.dark, 3.4, 1.6, 3.2, x, 0, 0, truss);
    [1, -1].forEach((dir) => {
      const tag = `${id}_${dir > 0 ? 'fwd' : 'aft'}`;
      box(`array_canister_${tag}`, M.dark, 4.6, 0.8, 1.2, x, 0, dir * 2.3, truss);
      cyl(`array_mast_${tag}`, M.truss, 0.2, 34, 'z', x, 0, dir * 19.5, truss, 0.2, 10);
      [-1, 1].forEach((side) => {
        for (let i = 0; i < 2; i++) {
          box(`solar_blanket_${tag}_${side > 0 ? 'a' : 'b'}${i}`, M.solar, 4.6, 0.06, 16.6,
            x + side * 2.95, 0, dir * (3.2 + 8.3 + i * 16.9), truss);
        }
      });
    });
    // photovoltaic radiator
    box(`pv_radiator_${id}`, M.radiator, 3.2, 12, 0.12, x + k * -3.6, 7.5, 0, truss);
  });

  // main heat-rejection radiators on S1/P1
  for (let i = 0; i < 3; i++) {
    box(`radiator_${s}1_${i}`, M.radiator, 3.4, 22, 0.14, k * (10 + i * 3.6), 13.2, -1.2, truss);
  }
  strut(`radiator_boom_${s}1`, M.truss, 0.25, [k * 13.6, 1.8, -1.2], [k * 13.6, 24, -1.2], truss);
});

// Pressurized modules — below the truss (earth-facing), long axis along z
const mods = new THREE.Group(); mods.name = 'pressurized_modules'; iss.add(mods);
const Y = -5;
cyl('truss_attach', M.truss, 0.9, 3, 'y', 0, -2.4, 7, mods);
cyl('Unity_Node1', M.module, 2.3, 5.5, 'z', 0, Y, 0, mods);
cyl('Destiny_Lab', M.module, 2.2, 8.5, 'z', 0, Y, 7.0, mods);
cyl('Harmony_Node2', M.module, 2.3, 7.2, 'z', 0, Y, 14.85, mods);
cyl('Columbus', M.module, 2.2, 6.9, 'x', 5.75, Y, 14.85, mods);
cyl('Kibo_PM', M.module, 2.2, 11.2, 'x', -7.9, Y, 14.85, mods);
cyl('Kibo_ELM', M.module, 2.1, 4.2, 'y', -6.5, Y + 4.3, 14.85, mods);
box('Kibo_exposed_facility', M.dark, 6, 1.2, 5, -16.6, Y, 14.85, mods);
cyl('Tranquility_Node3', M.module, 2.2, 6.7, 'x', -5.65, Y, 0, mods);
cyl('Cupola', M.dark, 1.5, 1.6, 'y', -5.2, Y - 2.9, 0, mods, 1.1);
cyl('Quest_Airlock', M.module, 2.0, 5.5, 'x', 5.0, Y, 0, mods);
cyl('PMA1', M.dark, 1.2, 1.6, 'z', 0, Y, -3.55, mods, 1.2);
cyl('Zarya', M.module, 2.05, 12.6, 'z', 0, Y, -10.65, mods);
cyl('Zvezda', M.module, 2.1, 10.2, 'z', 0, Y, -22.2, mods);
cyl('Zvezda_fwd', M.module, 1.4, 3, 'z', 0, Y, -15.6, mods);
const tp = new THREE.Mesh(new THREE.SphereGeometry(1.7, 40, 20), M.module); tp.name = 'Zvezda_transfer_node';
tp.position.set(0, Y, -16.9); mods.add(tp);
cyl('Poisk_MRM2', M.module, 1.3, 4, 'y', 0, Y + 3.2, -18.5, mods);
cyl('Nauka_MLM', M.module, 2.1, 13, 'y', 0, Y - 8.2, -16.9, mods);
[1, -1].forEach((k) => {
  box(`Zvezda_array_${k > 0 ? 'S' : 'P'}`, M.solarRu, 13, 0.06, 3.4, k * 9.3, Y, -25, mods);
  strut(`Zvezda_array_mast_${k > 0 ? 'S' : 'P'}`, M.truss, 0.12, [k * 2, Y, -25], [k * 15.8, Y, -25], mods);
});

// Visiting vehicles
const vv = new THREE.Group(); vv.name = 'visiting_vehicles'; iss.add(vv);
cyl('Progress_hull', M.module, 1.35, 7, 'z', 0, Y, -31.3, vv, 1.1);
[1, -1].forEach((k) => box(`Progress_array_${k}`, M.solarRu, 4.5, 0.05, 1.3, k * 3.7, Y, -33, vv));
cyl('Dragon_capsule', M.module, 1.0, 2.6, 'z', 0, Y, 19.9, vv, 1.95);
cyl('Dragon_trunk', M.dark, 1.95, 2.8, 'z', 0, Y, 22.9, vv);
cyl('Soyuz_orbital_module', M.module, 1.1, 2.6, 'y', 0, Y - 15.9, -16.9, vv);
cyl('Soyuz_descent_module', M.dark, 1.2, 2.1, 'y', 0, Y - 18.2, -16.9, vv, 0.9);

// Canadarm2
const arm = new THREE.Group(); arm.name = 'Canadarm2'; iss.add(arm);
strut('arm_boom_upper', M.radiator, 0.3, [2.6, -3, 8], [5, 3.5, 17], arm);
strut('arm_boom_lower', M.radiator, 0.3, [5, 3.5, 17], [4, -1, 26], arm);
const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), M.dark);
elbow.name = 'arm_elbow'; elbow.position.set(5, 3.5, 17); arm.add(elbow);

// ---------- Earth (stylised) ----------
const EARTH_R = 50, ORBIT_R = 60, ISS_SCALE = 0.11;

const earth = new THREE.Group(); earth.name = 'Earth';
const tex = await new THREE.TextureLoader().loadAsync('earth-texture.jpg');
tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; tex.name = 'earth_photo';
const surface = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 128, 64),
  new THREE.MeshStandardMaterial({ name: 'earth_surface', map: tex, roughness: 0.85, metalness: 0.0 }));
surface.name = 'earth_surface'; earth.add(surface);

const atmo = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.025, 96, 48),
  new THREE.MeshBasicMaterial({ name: 'atmosphere', color: 0x7fb4ff, transparent: true, opacity: 0.22, side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending }));
atmo.name = 'atmosphere'; earth.add(atmo);
earth.rotation.z = THREE.MathUtils.degToRad(23.4);

// ---------- orbit ----------
const scene = new THREE.Group(); scene.name = 'ISS_orbiting_Earth';
scene.add(earth);
const orbitPlane = new THREE.Group(); orbitPlane.name = 'orbit_plane';
orbitPlane.rotation.z = THREE.MathUtils.degToRad(51.6);
scene.add(orbitPlane);
const path = new THREE.Mesh(new THREE.TorusGeometry(ORBIT_R, 0.06, 6, 360),
  new THREE.MeshBasicMaterial({ name: 'orbit_path', color: 0xc9a24b, transparent: true, opacity: 0.45 }));
path.name = 'orbit_path'; path.rotation.x = Math.PI / 2; orbitPlane.add(path);
const orbit = new THREE.Group(); orbit.name = 'orbit'; orbitPlane.add(orbit);
iss.scale.setScalar(ISS_SCALE);
iss.position.set(ORBIT_R, 0, 0);
iss.rotation.z = -Math.PI / 2; // ISS +y (zenith) → radial out; modules along velocity
orbit.add(iss);
orbit.rotation.y = 0.9;

stage.setObject(scene);

// ---------- space look ----------
stage._ground.visible = false;
stage._key.castShadow = false;
stage._key.intensity = 3.2;
stage._key.position.set(5, 1.5, 2.5);
stage._scene.traverse((o) => {
  if (o.isHemisphereLight) o.intensity = 0.12;
  else if (o.isDirectionalLight && o !== stage._key) o.intensity = 0.08;
});
const sg = new THREE.BufferGeometry(), sp = new Float32Array(4000 * 3);
for (let i = 0; i < 4000; i++) {
  const v = new THREE.Vector3().randomDirection().multiplyScalar(1800);
  sp.set([v.x, v.y, v.z], i * 3);
}
sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
stage._scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0x9aa0ac, size: 1.4, sizeAttenuation: false })));
const cam = stage._camera, ctr = stage._controls;
cam.near = 0.05; cam.far = 5000; cam.updateProjectionMatrix();
cam.position.lerp(ctr.target, 0.45); ctr.update();
const home = { pos: cam.position.clone(), tgt: ctr.target.clone() };
const note = stage.shadowRoot.querySelector('.note'); if (note) note.style.color = '#8d8a82';

// ---------- animation + controls ----------
let paused = false, follow = false, last = performance.now();
const prev = new THREE.Vector3(), now = new THREE.Vector3();
const btnE = document.getElementById('vEarth'), btnI = document.getElementById('vIss'), btnP = document.getElementById('pause');
function setFollow(on) {
  follow = on;
  btnE.setAttribute('aria-pressed', String(!on)); btnI.setAttribute('aria-pressed', String(on));
  if (on) {
    iss.getWorldPosition(prev);
    cam.position.copy(iss.localToWorld(new THREE.Vector3(130, 150, 190)));
    ctr.target.copy(prev);
  } else { cam.position.copy(home.pos); ctr.target.copy(home.tgt); }
  ctr.update();
}
btnE.onclick = () => setFollow(false);
btnI.onclick = () => setFollow(true);
btnP.onclick = () => { paused = !paused; btnP.setAttribute('aria-pressed', String(paused)); btnP.textContent = paused ? 'Play' : 'Pause'; };

(function tick(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!paused) {
    orbit.rotation.y += dt * (2 * Math.PI / 90);   // one lap ≈ 90 s (the real one ≈ 92 min)
    surface.rotation.y += dt * 0.012;
  }
  if (follow) {
    iss.getWorldPosition(now);
    const d = now.clone().sub(prev);
    cam.position.add(d); ctr.target.add(d); prev.copy(now);
  }
  requestAnimationFrame(tick);
})(last);
</script>
</body>
</html>
